name: Source complexity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether the base has a policy
        id: policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:.lint-action.json" 2>/dev/null; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Source complexity starts on pull requests once the policy reaches main.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report source complexity
        if: github.event_name != 'pull_request' || steps.policy.outputs.available == 'true'
        uses: lhajoosten/lint-gate@cf1ece6767fbb5d86f21f3f979e44af6bebe3b71
