name: Release Log

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    # Enable after the App is set up; history boundaries are owner-approved.
    if: github.event.pull_request.merged == true && vars.RELEASE_LOG_ENABLED == 'true'
    uses: lhajoosten/release-log/.github/workflows/rolling-release.yml@e3f2d317370447f6608be17941ade53b099d8fd2
    with:
      tool-sha: e3f2d317370447f6608be17941ade53b099d8fd2
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      # Validate capture and generation before separately reviewing live writes.
      write: false
      configuration: >-
        {"schemaVersion":2,"repository":"lhajoosten/lucjoosten.nl","repositoryId":1458711968,"releaseBranch":"main","releasePolicy":"release-policy-v1","contextPolicy":"required","changelog":{"verbosity":"concise","format":"compact"},"bootstrap":{"baselineSha":"ed051000556633e810eaee8d9d403516c299b823","onboardingSha":"93cce7c4b3b8ca65e9102af6316860d23e3dcc8a"}}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
