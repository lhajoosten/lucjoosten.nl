name: Rolling Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-log-consumer-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  release:
    uses: lhajoosten/rolling-release/.github/workflows/consumer-release.yml@215ce3f9813f4159610442187656c614c5fd3b34
    with:
      release-branch: main
      app-id: ${{ vars.RELEASE_APP_ID }}
      bot-user-id: ${{ vars.RELEASE_BOT_USER_ID }}
      write-enabled: ${{ vars.RELEASE_LOG_WRITE_ENABLED != 'false' }}
      configuration: >-
        {
          "schemaVersion": 2,
          "repository": "lhajoosten/lucjoosten.nl",
          "repositoryId": 1458711968,
          "releaseBranch": "main",
          "releasePolicy": "release-policy-v1",
          "contextPolicy": "required",
          "changelog": {"verbosity": "concise", "format": "compact"},
          "bootstrap": {
            "baselineSha": "ed051000556633e810eaee8d9d403516c299b823",
            "onboardingSha": "93cce7c4b3b8ca65e9102af6316860d23e3dcc8a"
          },
          "adoptedRelease": {
            "pullNumber": 12,
            "headSha": "e00761aed3c185582b26b09c2c7ca97cb325e849",
            "landingSha": "50028db1e409a3948e376505d2bf7c7f291bcf27",
            "commitSha": "eb4e5115ebae8433b04fe0c74fc6e92f48a6b72f",
            "tag": "v0.1.0"
          }
        }
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
